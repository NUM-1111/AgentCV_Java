server:
  port: ${SERVER_PORT:8081}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      model-name: ${OPENAI_MODEL_NAME}
      timeout: 60s
      max-tokens: 8192
      log-requests: true
      log-responses: true

logging:
  level:
    # LangChain4j 框架层：DEBUG 可看到完整 Prompt 和原始响应体
    dev.langchain4j: DEBUG
    # AOP 切面：INFO 确保每次 AI 调用和 HTTP 请求都有日志
    com.jobagent.aspect: INFO
    # TraceIdFilter：INFO 级别
    com.jobagent.filter: INFO
    # 业务层：DEBUG 可看到 MatchEvaluationFacadeService 的裁剪日志
    com.jobagent: DEBUG
