server:
  port: ${SERVER_PORT:8081}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      model-name: ${OPENAI_MODEL_NAME}
      log-requests: true
      log-responses: true

# 便于观察 LangChain4j 的 DEBUG 日志（含请求/响应体）
logging:
  level:
    dev.langchain4j: DEBUG
